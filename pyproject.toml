[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seamlessnav-edge"
version = "0.4.0"
description = "Local IMU/GNSS navigation engine with versioned JSONL output"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
seamlessnav-edge = "navcore.edge_service:main"

[tool.setuptools]
packages = ["navcore"]
